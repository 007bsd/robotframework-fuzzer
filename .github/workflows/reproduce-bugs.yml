name: Fuzz and Reproduce

on: [push, pull_request]

jobs:
  fuzz-and-reproduce:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Fuzz harnesses (fail when bugs are found) ────────────────────────────

      - name: "[fuzz] String library"
        run: python fuzz/fuzz_string_library.py
        continue-on-error: true

      - name: "[fuzz] Collections library"
        run: python fuzz/fuzz_collections_library.py
        continue-on-error: true

      - name: "[fuzz] TypeInfoParser"
        run: python fuzz/fuzz_typeinfoparser.py
        continue-on-error: true

      # ── Python reproduce scripts (always exit 0) ─────────────────────────────

      - name: "[reproduce] String bugs — Python"
        run: python reproduce/reproduce_string_bugs.py

      - name: "[reproduce] Collections bugs — Python"
        run: python reproduce/reproduce_collections_bugs.py

      - name: "[reproduce] TypeInfoParser bug — Python"
        run: python reproduce/reproduce_typeinfoparser_bug.py

      # ── Robot reproduce scripts ───────────────────────────────────────────────

      - name: "[reproduce] String bugs — Robot"
        run: python -m robot reproduce/reproduce_string_bugs.robot
        continue-on-error: true

      - name: "[reproduce] Collections bugs — Robot"
        run: python -m robot reproduce/reproduce_collections_bugs.robot
        continue-on-error: true

      - name: "[reproduce] TypeInfoParser bug — Robot"
        working-directory: reproduce
        run: python -m robot reproduce_typeinfoparser_bug.robot
        continue-on-error: true
